name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on any branch: lets the experimental Linux job iterate
  # without opening a pull request per fix.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # M0.8 (experimental): POSIX compilation and platform-neutral suite.
  # Allowed to fail while Linux/macOS write-safety guarantees mature; the
  # result is visible evidence, never a silent gap and never a gate.
  rust-linux-experimental:
    name: Rust on Linux (experimental M0.8)
    runs-on: ubuntu-latest
    # No longer `continue-on-error`. It was, and the job spent weeks red while
    # everyone learned to scroll past it — which is worse than having no Linux
    # job at all, because a check nobody must heed stops being a check and
    # starts being noise that hides the next real failure.
    #
    # It rotted one test at a time: the `#[cfg(windows)]` convention already
    # existed in `df-facade`, and tests added since simply did not get it. A
    # green blocking job is what makes the next omission visible on the day it
    # happens instead of a month later.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude dataforge-desktop --all-targets -- -D warnings

      # The subset is defined by `#[cfg(windows)]` on the tests that cannot
      # pass here — execution refuses fail-closed off Windows (ADR-0017) and
      # filesystem classification is a Windows API — not by a list kept in this
      # file, which would drift the first time somebody adds a test.
      - name: Tests (platform-neutral subset)
        run: cargo test --workspace --exclude dataforge-desktop

  # M0.9 (experimental): fuzz the untrusted-input parsers with libFuzzer.
  # Allowed to fail while the harnesses mature; a discovered panic is visible
  # evidence, never a silent gap and never a gate. Needs nightly + libFuzzer,
  # so it only runs on Linux and lives in its own workspace (crates/fuzz).
  fuzz:
    name: Fuzz targets (experimental M0.9)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every fuzz target
        working-directory: fuzz
        run: cargo +nightly fuzz build

      - name: Smoke-run each target (short)
        working-directory: fuzz
        run: |
          for target in fingerprint_parse raw_path_from_blob \
                        extract_worker_response safe_relative_path; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=20 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  rust:
    name: Rust (fmt, clippy, tests, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # df-corpus is not a default member (it is a dev tool), so its fast
      # full-pipeline test needs an explicit invocation. The 100k scale run
      # stays #[ignore]d and on-demand (docs/testing/corpus-and-scale.md).
      - name: Corpus pipeline test
        run: cargo test -p df-corpus

      - name: Build CLI
        run: cargo build -p dataforge-cli

  desktop:
    name: Desktop (typecheck + frontend build + tauri check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter dataforge-desktop typecheck

      - name: Accessible UI render tests
        run: pnpm --filter dataforge-desktop test:ui

      - name: Build frontend
        run: pnpm --filter dataforge-desktop build

      - name: Check Tauri shell (MSVC)
        run: cargo check -p dataforge-desktop

  hardening:
    name: Filesystem hardening (Windows)
    runs-on: windows-latest
    # These tests plant real junctions with `mklink /J` and deny read access
    # with `icacls`. Where that is forbidden they used to print SKIP and pass,
    # so this job could go green having proved nothing at all — a result that
    # looks like evidence and is not. This turns any such skip into a failure,
    # which is the only thing that makes the green mean what it claims.
    env:
      DF_REQUIRE_HARDENING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Filesystem safety boundary
        run: cargo test -p df-fs-safety -- --nocapture

      - name: Executor and verifier hardening (junctions, no-replace)
        run: cargo test -p df-executor -p df-verifier -- --nocapture

      - name: Tamper tests (manifest, inventory, marker)
        run: cargo test -p df-db -p df-facade -p df-planner

      - name: Migration compatibility (0.1 database opens under 0.1.1)
        run: cargo test -p df-db a_v0_1_database_migrates_forward_and_keeps_its_data -- --nocapture

  supply-chain:
    name: Dependency audit
    runs-on: windows-latest
    # Write access only so a Dependabot branch can regenerate its own SBOM
    # below. Every other branch keeps the read-only default of this workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The regeneration step pushes back to the branch it came from, so
          # it needs the branch and not the detached merge commit.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      # The release workflow diffs the committed SBOM against a fresh
      # generation and fails hard when they disagree — but it only runs on a
      # tag or a dispatch, so until now nothing checked this on a pull request.
      # Twice a dependency change landed on main without regenerating the SBOM,
      # and both times the drift was invisible until someone tagged and got no
      # release at all. Same check, moved to where it can still be cheap to fix.
      - name: SBOM matches Cargo.lock
        shell: bash
        env:
          # Dependabot edits Cargo.lock and cannot edit anything else, so every
          # dependency bump it opened was born failing this check and could not
          # be made to pass without a human running one command. Twelve such
          # pull requests were open at once. On those branches, and only those,
          # the check regenerates the file it is about to complain about.
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/') }}
        run: |
          python scripts/generate-sbom.py > /tmp/fresh.cdx.json
          if diff -q docs/sbom/dataforge.cdx.json /tmp/fresh.cdx.json > /dev/null; then
            echo "SBOM is current"
            exit 0
          fi
          if [ "$IS_DEPENDABOT" != "true" ]; then
            echo "::error::The committed SBOM does not match Cargo.lock."
            echo "Regenerate it in the same commit that changes dependencies:"
            echo "  python scripts/generate-sbom.py > docs/sbom/dataforge.cdx.json"
            diff docs/sbom/dataforge.cdx.json /tmp/fresh.cdx.json | head -40
            exit 1
          fi
          cp /tmp/fresh.cdx.json docs/sbom/dataforge.cdx.json
          # Exactly one path, staged by name. A step that can write to the
          # branch must be unable to carry anything else along with it.
          git add docs/sbom/dataforge.cdx.json
          if [ -n "$(git diff --cached --name-only | grep -v '^docs/sbom/dataforge.cdx.json$')" ]; then
            echo "::error::refusing to push: something other than the SBOM is staged"
            git diff --cached --name-only
            exit 1
          fi
          git -c user.name='github-actions[bot]'               -c user.email='41898282+github-actions[bot]@users.noreply.github.com'               commit -m 'chore(sbom): regenerate for this dependency bump'
          git push origin HEAD:"$GITHUB_HEAD_REF"
          echo "SBOM regenerated and pushed; the audit passes on the content it just wrote"
