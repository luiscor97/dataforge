[package]
name = "df-facade"
description = "Stable local API of the DataForge engine; every client (CLI, desktop) goes through this crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
df-error = { workspace = true }
df-domain = { workspace = true }
df-fs-safety = { workspace = true }
df-db = { workspace = true }
df-ledger = { workspace = true }
df-scan = { workspace = true }
df-hash = { workspace = true }
df-planner = { workspace = true }
df-executor = { workspace = true }
df-verifier = { workspace = true }
df-media = { workspace = true }
df-plugin = { workspace = true }
df-ai = { workspace = true }
df-process-safety = { workspace = true }
keyring = { workspace = true }
ureq = { workspace = true }
df-similarity = { workspace = true }
df-extract = { workspace = true }
df-search = { workspace = true }
df-query = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
# The gate's own crate. Storing and reading a rule set is not gating anything —
# nothing consults these at decision time yet — but the set has to be written
# and verified through the crate that owns its digest, or a second
# implementation of that digest appears here and can disagree.
df-rules = { workspace = true }

[dev-dependencies]
df-db = { workspace = true, features = ["test-support"] }
# Dev-only, and a cycle on purpose: `df-tools` is built on this facade, but its
# tool names are a frozen contract and `frozen_contracts` is where those live.
df-tools = { workspace = true }
df-agent = { workspace = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "std", "zeroize"] }
tempfile = { workspace = true }
